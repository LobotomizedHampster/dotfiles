
# Font
font_family   CaskaydiaMono Nerd Font
bold_font     auto
italic_font   auto
font_size     12.0

# erase text on screen
map ctrl+shift+o clear_terminal scrollback only_active

# change background opacity
background_opacity 0.65

# add padding to the sides of the window
window_padding_width 1

# Color palette
include       ~/.config/kitty/doodle.conf
