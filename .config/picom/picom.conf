###############################
###         BACKEND         ###
###############################

backend = "glx";
#xrender-sync-fence = true;  # Helpful for NVIDIA cards
vsync = true;
#glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = false;


###############################
###         SHADOWS         ###
###############################

shadow = false;
shadow-radius = 12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.7;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Polybar'",
];


###############################
###         FADING          ###
###############################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;


###############################
###      TRANSPARENCY       ###
###############################

inactive-opacity = 1;
active-opacity = 1;
frame-opacity = 1;
opacity-rule = [
  "65:class_g = 'Alacritty' && focused",
  "50:class_g = 'Alacritty' && !focused",
  "100:class_g = 'kitty' && focused",
  #"50:class_g = 'kitty' && !focused",
  "100:class_g = 'zen' && !focused",
  "100:class_g = 'zen' && focused",
  "65:class_g = 'dmenu'",
]


###############################
###          BLUR           ###
###############################

blur-background = false;
blur-method = "dual_kawase";
blur-strength = 0;


###############################
###         CORNERS         ###
###############################

corner-radius = 8;
rounded-corners-exclude = [
  "QTILE_INTERNAL:32c = 1",
  "class_g = 'dmenu'",
];


###############################
###      EXPERIMENTAL       ###
###############################

detect-rounded-corners = true;
detect-client-opacity = true;
egl = false;  # add this line to disable egl backend
